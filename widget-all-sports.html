<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outliers Athletics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;padding:0;background:transparent;}

  #fhs-all {
    --ink:#1a0a0d;--maroon:#7c021e;--maroon-deep:#4a0112;
    --blue:#0bc8ee;--blue-soft:#bdf1fb;--chalk:#F4F6F9;
    --line:#DDE2E8;--muted:#93909a;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'Inter','SFMono-Regular',Consolas,Menlo,monospace;
    --font-brand:'Forte','Comic Sans MS',cursive;
    box-sizing:border-box;background:var(--chalk);color:var(--ink);
    font-family:var(--font-body);border-radius:14px;overflow:hidden;border:1px solid var(--line);
  }
  #fhs-all *,#fhs-all *::before,#fhs-all *::after{box-sizing:border-box;}
  #fhs-all .fhs-header{background:#000;color:#fff;padding:18px 24px 16px;position:relative;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;}
  #fhs-all .fhs-header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-soft) 60%,transparent 100%);}
  #fhs-all .fhs-logo{height:46px;width:auto;display:block;}
  #fhs-all .fhs-tagline{font-family:var(--font-brand);font-size:17px;letter-spacing:.02em;color:var(--blue);margin:0;}
  #fhs-all .fhs-updated{font-size:11.5px;opacity:.7;font-family:var(--font-mono);white-space:nowrap;width:100%;text-align:right;}
  #fhs-all .fhs-header-left{display:flex;align-items:center;gap:12px;}
  #fhs-all .fhs-filters{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px 4px;}
  #fhs-all .fhs-pill{font-family:var(--font-body);font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--maroon);background:transparent;color:var(--maroon);cursor:pointer;transition:background .15s,color .15s;}
  #fhs-all .fhs-pill:hover{background:rgba(124,2,30,.08);}
  #fhs-all .fhs-pill[aria-pressed="true"]{background:var(--maroon);color:#fff;}
  #fhs-all .fhs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding:16px 20px 22px;}
  #fhs-all .fhs-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;}
  #fhs-all .fhs-card.fhs-hidden{display:none;}
  #fhs-all .fhs-card-head{display:flex;align-items:flex-start;gap:10px;}
  #fhs-all .fhs-badge-plate{width:52px;height:52px;flex:none;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #fhs-all .fhs-badge-plate img{width:90%;height:90%;object-fit:contain;}
  #fhs-all .fhs-card-titles{flex:1;min-width:0;}
  #fhs-all .fhs-sport{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--maroon);font-weight:700;margin:0 0 1px;}
  #fhs-all .fhs-level{font-size:15px;font-weight:700;margin:0;color:var(--ink);}
  #fhs-all .fhs-season-yr{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 0;font-family:var(--font-mono);}
  #fhs-all .fhs-status{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none;background:var(--chalk);color:var(--muted);border:1px solid var(--line);}
  #fhs-all .fhs-status.is-final{background:#FDEDEF;color:var(--maroon);border-color:#F5C9D1;}
  #fhs-all .fhs-status.is-pre{background:#E6F9FD;color:#047a93;border-color:#BDEEF8;}
  #fhs-all .fhs-status.is-live{background:#E8F8EE;color:#1a7a40;border-color:#B8EAC9;}
  #fhs-all .fhs-record-row{display:flex;align-items:baseline;gap:10px;}
  #fhs-all .fhs-record{font-family:var(--font-mono);font-size:28px;font-weight:800;color:var(--maroon-deep);line-height:1;}
  #fhs-all .fhs-pct{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  #fhs-all .fhs-strip-label{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0;}
  #fhs-all .fhs-strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
  #fhs-all .fhs-pip{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--maroon);flex:none;}
  #fhs-all .fhs-pip.is-win{background:var(--blue);border-color:var(--blue);}
  #fhs-all .fhs-pip.is-loss{background:transparent;}
  #fhs-all .fhs-pip.is-tie{background:var(--muted);border-color:var(--muted);}
  #fhs-all .fhs-next{font-size:13px;background:var(--chalk);border-radius:8px;padding:8px 10px;line-height:1.4;margin:0;}
  #fhs-all .fhs-next strong{color:var(--maroon-deep);}
  #fhs-all .fhs-note{font-size:13px;color:var(--muted);font-style:italic;line-height:1.4;margin:0;}
  #fhs-all details.fhs-sched{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;}
  #fhs-all details.fhs-sched summary{font-size:13px;font-weight:600;color:var(--maroon);cursor:pointer;list-style:none;}
  #fhs-all details.fhs-sched summary::-webkit-details-marker{display:none;}
  #fhs-all details.fhs-sched summary::before{content:"\25B8 ";display:inline-block;transition:transform .15s;}
  #fhs-all details.fhs-sched[open] summary::before{transform:rotate(90deg);}
  #fhs-all .fhs-game-list{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
  #fhs-all .fhs-game-list li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 2px;border-bottom:1px dashed var(--line);}
  #fhs-all .fhs-game-date{font-family:var(--font-mono);color:var(--muted);flex:none;width:64px;}
  #fhs-all .fhs-game-opp{flex:1;}
  #fhs-all .fhs-game-res{font-family:var(--font-mono);font-weight:700;flex:none;}
  #fhs-all .fhs-game-res.w{color:#1f8a4c;}
  #fhs-all .fhs-game-res.l{color:#b3273e;}
  #fhs-all .fhs-live-embed{min-height:180px;}
  #fhs-all .fhs-live-cap{font-size:11px;color:var(--muted);text-align:center;margin:0;}
  #fhs-all .fhs-link{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--maroon);text-decoration:none;border-top:1px solid var(--line);padding-top:8px;}
  #fhs-all .fhs-link:hover{color:var(--blue);text-decoration:underline;}
  #fhs-all .fhs-footer{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 20px 18px;line-height:1.6;}
  #fhs-all .fhs-footer a{color:var(--maroon);text-decoration:none;font-weight:600;}
  #fhs-all .fhs-footer a:hover{text-decoration:underline;}

</style>
</head>

  function localToday(){var d=new Date(),mm=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;}
  function daysFromNow(n){var d=new Date();d.setDate(d.getDate()+n);var mm=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;}
  function pickSeason(seasons){
    if(!seasons||!seasons.length)return null;
    var today=localToday(),preview=daysFromNow(60),i,s;
    for(i=0;i<seasons.length;i++){s=seasons[i];if(today>=s.startDate&&today<=s.endDate)return s;}
    var soon=seasons.filter(function(s){return s.startDate>today&&s.startDate<=preview;}).sort(function(a,b){return a.startDate<b.startDate?-1:1;});
    if(soon.length)return soon[0];
    var past=seasons.filter(function(s){return s.endDate<today;}).sort(function(a,b){return a.endDate>b.endDate?-1:1;});
    if(past.length)return past[0];
    var future=seasons.filter(function(s){return s.startDate>today;}).sort(function(a,b){return a.startDate<b.startDate?-1:1;});
    return future.length?future[0]:seasons[seasons.length-1];
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(iso){var d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
  function cardHead(team,yr,stTxt,stCls){
    return '<div class="fhs-card-head"><span class="fhs-badge-plate"><img src="'+BADGES[team.icon]+'" alt="'+esc(team.sport)+'"></span>'+
      '<div class="fhs-card-titles"><p class="fhs-sport">'+esc(team.sport)+'</p><h3 class="fhs-level">'+esc(team.level)+'</h3>'+(yr?'<p class="fhs-season-yr">'+esc(yr)+'</p>':'')+
      '</div><span class="fhs-status '+stCls+'">'+stTxt+'</span></div>';
  }
  function buildCard(team){
    var el=document.createElement('article');el.className='fhs-card';el.dataset.sport=team.sport;el.dataset.group=team.level;
    if(team.liveEmbed){
      el.innerHTML=cardHead(team,null,'Live','is-live')+(team.note?'<p class="fhs-note">'+esc(team.note)+'</p>':'')+
        '<div class="fhs-live-embed" id="'+team.liveEmbed.cid+'"></div>'+
        '<p class="fhs-live-cap">Live schedule &amp; scores via GameChanger</p>'+
        '<a class="fhs-link" href="'+esc(team.gcUrl)+'" target="_blank" rel="noopener">View on GameChanger &#x2192;</a>';
      return el;
    }
    var sn=pickSeason(team.seasons);if(!sn)return el;
    var today=localToday();
    var played=sn.games.filter(function(g){return g.res==='W'||g.res==='L'||g.res==='T';});
    var upcoming=sn.games.filter(function(g){return g.res!=='W'&&g.res!=='L'&&g.res!=='T';});
    var next=upcoming.length?upcoming.slice().sort(function(a,b){return a.date<b.date?-1:1;})[0]:null;
    var last=played.length?played.slice().sort(function(a,b){return a.date<b.date?-1:1;})[played.length-1]:null;
    var hasRec=sn.record!=null,w=hasRec?sn.record.w:0,l=hasRec?sn.record.l:0,t=hasRec&&sn.record.t?sn.record.t:0;
    var tot=w+l+t,pct=hasRec&&tot>0?Math.round(((w+0.5*t)/tot)*100):null;
    var stCls,stTxt;
    if(!hasRec){stCls='is-pre';stTxt=sn.startDate>today?'Upcoming':'Pre-Season';}
    else if(next){stCls='is-pre';stTxt='In Season';}else{stCls='is-final';stTxt='Final';}
    var strip='';
    if(played.length){
      var shown=played.slice().sort(function(a,b){return a.date<b.date?-1:1;}).slice(-10);
      strip='<p class="fhs-strip-label">Recent form</p><div class="fhs-strip">'+shown.map(function(g){return'<span class="fhs-pip '+(g.res==='W'?'is-win':g.res==='T'?'is-tie':'is-loss')+'" title="'+(g.res==='W'?'Win':g.res==='T'?'Tie':'Loss')+' vs '+esc(g.opp)+'"></span>';}).join('')+'</div>';
    }
    var mid='';
    if(next){mid='<p class="fhs-next">Next: <strong>'+fmtDate(next.date)+'</strong> '+(next.ha==='home'?'vs ':'@ ')+esc(next.opp)+(next.time&&next.time!=='TBA'?' \u00b7 '+esc(next.time):'')+' </p>';}
    else if(last){mid='<p class="fhs-next">Last: <strong>'+last.res+' '+esc(last.score||'')+'</strong> '+(last.ha==='home'?'vs ':'@ ')+esc(last.opp)+' ('+fmtDate(last.date)+')</p>';}
    else if(sn.note){mid='<p class="fhs-note">'+esc(sn.note)+'</p>';}
    var list='';
    if(sn.games.length){
      var sorted=sn.games.slice().sort(function(a,b){return a.date<b.date?-1:1;});
      list='<details class="fhs-sched"><summary>Schedule &amp; results ('+sorted.length+')</summary><ul class="fhs-game-list">'+
        sorted.map(function(g){var done=g.res==='W'||g.res==='L'||g.res==='T';
          return'<li><span class="fhs-game-date">'+fmtDate(g.date)+'</span><span class="fhs-game-opp">'+(g.ha==='home'?'vs ':'@ ')+esc(g.opp)+'</span><span class="fhs-game-res '+(done?g.res.toLowerCase():'')+'">'+(done?g.res+' '+esc(g.score||''):g.time&&g.time!=='TBA'?esc(g.time):'TBD')+'</span></li>';
        }).join('')+'</ul></details>';
    }
    el.innerHTML=cardHead(team,sn.year,stTxt,stCls)+'<div class="fhs-record-row">'+(hasRec?'<span class="fhs-record">'+w+'\u2013'+l+(t?'\u2013'+t:'')+'</span>'+(pct!=null?'<span class="fhs-pct">'+pct+'% win rate</span>':''):'<span class="fhs-record" style="color:var(--muted)">\u2014</span>')+'</div>'+strip+mid+list+'<a class="fhs-link" href="'+esc(sn.mpUrl)+'" target="_blank" rel="noopener">View on MaxPreps &#x2192;</a>';
    return el;
  }
  function addPill(parent,label,active){var b=document.createElement('button');b.className='fhs-pill';b.type='button';b.textContent=label;b.dataset.sport=label;b.setAttribute('aria-pressed',active?'true':'false');parent.appendChild(b);}

  function render(){
    // Show today's date — generated live so caching never makes it stale
    document.getElementById('fhs-stamp').textContent=
      'Updated: '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    var grid=document.getElementById('fhs-grid'),filters=document.getElementById('fhs-filters'),groups=[];
    TEAMS.forEach(function(t){if(groups.indexOf(t.level)===-1)groups.push(t.level);});
    addPill(filters,'All',true);groups.forEach(function(g){addPill(filters,g,false);});
    TEAMS.forEach(function(t){grid.appendChild(buildCard(t));});
    filters.addEventListener('click',function(e){
      var btn=e.target.closest('.fhs-pill');if(!btn)return;
      [].forEach.call(filters.querySelectorAll('.fhs-pill'),function(p){p.setAttribute('aria-pressed','false');});
      btn.setAttribute('aria-pressed','true');var sp=btn.dataset.sport;
      [].forEach.call(grid.querySelectorAll('.fhs-card'),function(c){c.classList.toggle('fhs-hidden',sp!=='All'&&c.dataset.sport!==sp);});
    });
  }
  render();
})();
</script>
